# wetrecomp - hardware / rendering settings
#
# Loaded automatically at startup (see OnConfigurePaths in
# src/wetrecomp_app.h) and rewritten by the in-game Settings overlay's
# "Save to config" button. --flag on the command line and REX_* environment
# variables always override values from this file - see ../settings/README.md.
#
# Flat key = value only

# native / xenos
gpu_plugin = "native"

# "any" (d3d12 - win default, vulkan - lin default)
# "d3d12" / "vulkan" / "d3d11"
graphics_backend = "vulkan"
vsync = true
resolution_scale = 2
present_effect = "bilinear"
present_fsr_sharpness_reduction = 0.3
present_dither = true
swap_post_effect = "smaa"
async_shader_compilation = true
native_2x_msaa = true
anisotropic_override = 5
present_fsr_quality_mode = "auto"
present_fsr_max_upsampling_passes = 1
present_cas_additional_sharpness = 0.2

# native render option
#native_resolution_scale = 2.25

readback_memexport = true
readback_memexport_fast = true
readback_resolve = "fast"
host_present_from_non_ui_thread	= true
gpu_allow_invalid_fetch_constants = true
depth_bias_shader_offset = true
shared_memory_skip_unchanged_uploads = true
async_depth_only_pipelines = true

window_width = 1920
window_height = 1080
fullscreen = true
monitor = 0
resolution = "1920x1080"
render_target_path_d3d12 = "rtv"
render_target_path_vulkan = "fbo"
store_shaders = true
present_letterbox = true

d3d12_adapter = -1
d3d12_allow_variable_refresh_rate_and_tearing = true
d3d12_bindless = true
d3d12_break_on_error = false
d3d12_break_on_warning = false
d3d12_queue_priority = 2
d3d12_submit_on_primary_buffer_end = true
d3d12_tessellation_wireframe = false
d3d12_readback_resolve = false

vulkan_device = -1
vulkan_log_debug_messages = false
vulkan_allow_present_mode_immediate = false
vulkan_allow_present_mode_fifo_relaxed = false
vulkan_allow_present_mode_mailbox = true
vulkan_async_skip_incomplete_frames = false
vulkan_hoist_shared_memory_uploads = true
vulkan_allow_present_mode_fifo_latest_ready = true
vulkan_resolve_into_textures = true

d3d11_adapter = -1
#d3d11_block_compressed_textures = true
d3d11_resolve_into_textures = true
d3d11_debug = false

headless = false

# trace, debug, info, warn, error, critical
log_level = "error"

# Perf CSV log path (per-frame metrics). Empty = disabled.
# Only works when REXGLUE_ENABLE_PERF_COUNTERS is defined (non-Release).
#perf_log_csv = "benchmark.csv"
#frame_stats_interval = 5

# Enable runtime debug tools (stub sweep, missing function scan).
# Produces logs/missed_functions.txt and logs/stub_sweep.txt.
dev_debug_runtime = false
unregistered_function_log = "unregistered_functions.txt"
trace_gpu_prefix = "traces"

# Ported xenia-canary game-patches for WET (src/game_patches.cpp, hooks in
# patches.toml). The 60 FPS patch is off in the compiled default (as upstream):
# it can affect physics/animation timing.
wet_fps60_unlock = true
wet_disable_motion_blur = false
wet_disable_depth_of_field = false
wet_disable_shaky_camera = false

# 0 = busy spin (original), 1 = yield the core, 2 = sleep 200us
wet_gpu_wait_mode = 2
wet_match_display_refresh = true

# Xbox locale language (read by the game through XCONFIG_USER_LANGUAGE):
#  1 = English   3 = German   4 = French   5 = Spanish   6 = Italian
# The retail disc only ships these five; any other value falls back to English.
# Restart the game after changing it.
user_language = 1
